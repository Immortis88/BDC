<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100">
  <defs>
    <linearGradient id="dropGradCombined" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D3F"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <pattern id="microGridCombined" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 6 0 L 0 0 0 6" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="0.8"/>
    </pattern>
    <filter id="softShadowCombined" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF" rx="8"/>

  <!-- Left: Square Emblem Badge (Lifetime Reusable, No Years) -->
  <g transform="translate(14, 8)">
    <!-- Base Card -->
    <rect x="0" y="0" width="84" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadowCombined)"/>
    <!-- Micro Grid Texture (Matching Reference Image Style) -->
    <rect x="2" y="2" width="80" height="80" rx="8" fill="url(#microGridCombined)"/>
    
    <!-- Aesthetic Corner Brackets -->
    <path d="M 6 15 L 6 6 L 15 6" fill="none" stroke="#FF4D3F" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 78 69 L 78 78 L 69 78" fill="none" stroke="#FF4D3F" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Center Blood Drop + Heartbeat Lifeline -->
    <g transform="translate(42, 38)">
      <!-- Blood Drop Shape -->
      <path d="M 0 -22 C 14 -8 20 6 20 16 C 20 27 11 35 0 35 C -11 35 -20 27 -20 16 C -20 6 -14 -8 0 -22 Z" fill="url(#dropGradCombined)"/>
      <!-- Drop Highlight Gloss -->
      <path d="M -9 11 C -9 3 -5 -6 0 -13 C -3 -5 -4 3 -4 11 C -4 14 -2 17 0 19 C -6 18 -9 15 -9 11 Z" fill="#FFFFFF" opacity="0.35"/>
      <!-- Lifeline Pulse across drop -->
      <path d="M -13 16 L -6 16 L -3 10 L 1 22 L 5 13 L 8 18 L 13 18" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bottom Tag Pill: Everlasting Blood Donation -->
    <rect x="13" y="69" width="58" height="11" rx="5.5" fill="#FFFFFF" stroke="#FF4D3F" stroke-width="1"/>
    <text x="42" y="77.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="6.2" fill="#FF4D3F" text-anchor="middle" letter-spacing="0.5">DONATE BLOOD</text>
  </g>

  <!-- Right: Typography Lockup (Only BDC, No Fest, No Years) -->
  <g transform="translate(116, 14)">
    <!-- Main Headline: "BDC" in bold, high-contrast, modern geometric sans-serif -->
    <text x="0" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#1E232A">B</tspan><tspan fill="#FF4D3F">DC</tspan>
    </text>

    <!-- Subtitle: Clean Slate-Grey Location & Campus -->
    <text x="2" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#64748B" letter-spacing="0.2">
      SKIT · Jaipur · Blood Donation Camp
    </text>
  </g>
</svg>
